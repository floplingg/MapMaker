name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MapMaker
          path: build/libs/mapmaker-*[0-9].jar
      - name: Publish jar to the builds branch
        run: |
          JAR=$(ls build/libs/mapmaker-*[0-9].jar)
          mkdir /tmp/out && cp "$JAR" /tmp/out/
          cd /tmp/out
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
